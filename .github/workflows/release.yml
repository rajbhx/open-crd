name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  receiver-apk:
    name: signed APK -> GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses > /dev/null || true

      - name: Install SDK packages
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Compute version (strip leading v)
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Materialize release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "${ANDROID_KEYSTORE_BASE64}" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is not configured"
            exit 1
          fi
          printf '%s' "${ANDROID_KEYSTORE_BASE64}" | base64 -d > receiver-android/app/release.keystore

      - name: Build signed release APK
        working-directory: receiver-android
        env:
          ANDROID_KEYSTORE_BASE64: configured
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          OPENCRD_VERSION: ${{ steps.ver.outputs.version }}
        run: gradle --no-daemon :app:assembleRelease

      - name: Collect artifacts
        run: |
          mkdir -p dist
          cp receiver-android/app/build/outputs/apk/release/app-release.apk "dist/opencrd-receiver-${GITHUB_REF_NAME}.apk"
          cd dist
          sha256sum ./*.apk > SHA256SUMS.txt
          ls -l

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "dist/opencrd-receiver-${GITHUB_REF_NAME}.apk" \
            dist/SHA256SUMS.txt \
            --title "OpenCRD Receiver ${GITHUB_REF_NAME}" \
            --notes-file receiver-android/RELEASE_NOTES.md
