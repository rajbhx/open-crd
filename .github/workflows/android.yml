name: android

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  receiver-apk:
    name: receiver APK (Kotlin, debug)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK packages
        run: |
          SDKMGR=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | sort -V | tail -1)
          echo "using sdkmanager: $SDKMGR"
          yes | "$SDKMGR" --licenses > /dev/null || true
          "$SDKMGR" --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build debug APK
        working-directory: receiver-android
        run: gradle --no-daemon :app:assembleDebug

      - name: Check APK output
        working-directory: receiver-android
        run: |
          ls -l app/build/outputs/apk/debug/
          test -f app/build/outputs/apk/debug/app-debug.apk

      - uses: actions/upload-artifact@v7
        with:
          name: opencrd-receiver-apk-debug
          path: receiver-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
